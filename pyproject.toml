[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robex"
version = "0.1.0"
description = "Intelligent AI-assisted vision macro and automation suite for Roblox"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Robex Developers" }
]
dependencies = [
    "customtkinter>=5.2.0",
    "pyautogui>=0.9.54",
    "pydirectinput>=1.0.4",
    "pynput>=1.7.6",
    "opencv-python-headless>=4.8.0.76",
    "pillow>=10.0.0",
    "mss>=9.0.1",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.5.0",
    "ruff>=0.4.0",
]

[project.scripts]
robex = "robex.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

